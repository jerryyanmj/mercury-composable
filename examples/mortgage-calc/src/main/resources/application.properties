spring.application.name=mortgage-calc
info.app.version=1.0.0
info.app.description=Mortgage Amortization Calculator
#
# Local server port
#
rest.server.port=8083
rest.automation=true
yaml.rest.automation=classpath:/rest.yaml
yaml.flow.automation=classpath:/flows.yaml
#
# CompileGraph quality gate: validates and compiles the manifest-listed graph models at
# startup. Only graphs that pass become executable at POST /api/graph/{graph_id}.
#
graph.model.automation=classpath:/graphs.yaml
#
log.format=text
cloud.connector=none
snake.case.serialization=true
#
# scan for @PreLoad functions and Spring components (com.accenture.* is always scanned too)
#
web.component.scan=com.accenture
#
# expose graph.health on the /health admin endpoint
#
mandatory.health.dependencies=graph.health
