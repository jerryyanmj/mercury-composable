application.name=order-manager
info.app.version=1.0.0
info.app.description=Order Fulfillment System - Manager (CQRS read model, order intake, outbox relay)

rest.server.port=8081
rest.automation=true
server.port=8091

log.format=json

spring.web.resources.static-locations=classpath:/public

web.component.scan=com.accenture.ordersystem.manager

cloud.connector=none

kafka.bootstrap.servers=localhost:9092
kafka.flow.max.retries=3
kafka.flow.retry.backoff.ms=500

yaml.kafka.flow.adapter=classpath:/kafka-flow-adapter.yaml
yaml.cron=classpath:/cron.yaml
yaml.rest.automation=classpath:/rest.yaml
yaml.flow.automation=classpath:/flows.yaml

mandatory.health.dependencies=postgres.health

postgres.host=127.0.0.1
postgres.port=5432
postgres.database=manager
postgres.user=jerry.yan
postgres.password=
postgres.ssl=false
postgres.repository.scan=com.accenture.ordersystem.manager

api.origin=*

snake.case.serialization=true

show.application.properties=server.port, cloud.connector

#
# Demo mode. Start with DEMO_MODE=true to drive the pipeline by hand:
# the scheduled jobs become no-ops and the SoR mock stops acknowledging automatically,
# so every step is invoked through an /api/v1/admin or /api/v1/sor endpoint instead.
#
demo.mode=${DEMO_MODE:false}
