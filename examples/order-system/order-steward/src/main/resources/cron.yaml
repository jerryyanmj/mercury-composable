#
# Scheduled jobs for the Order Steward
# NOTE: the cron interval must exceed 10 seconds - the scheduler adds a random
# 0-9s deferred-start delay for racing-condition avoidance.
#
jobs:
  - name: "steward-outbox-relay"
    description: "Relay unsent outbox rows to Kafka"
    cron: "0/15 0/1 * 1/1 * ? *"
    service: "v1.steward.outbox.relay"
    resolver: "v1.job.state.resolver"

  - name: "steward-scheduled-dispatch"
    description: "Dispatch SCHEDULED fulfillments to the SoR (the dispatch-window tick)"
    cron: "0/30 0/1 * 1/1 * ? *"
    service: "v1.scheduled.dispatch"
    resolver: "v1.job.state.resolver"

deferred.start: true
leader.election: false
