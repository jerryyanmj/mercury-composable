flow:
  id: 'graph-executor'
  description: 'MiniGraph executor — POST /api/graph/{graph_id} dispatches here'
  ttl: 60s
  exception: 'graph.exception.handler'

first.task: 'graph.executor'

tasks:
  - input:
      - 'model.instance -> header.instance'
      - 'input.path_parameter.graph_id -> header.graph'
    process: 'graph.executor'
    output:
      - 'status -> output.status'
      - 'header -> output.header'
      - 'result -> output.body'
    description: 'Execute the named graph with the request body as input'
    execution: end

  - input:
      - 'error.code -> status'
      - 'error.message -> message'
      - 'error.stack -> stack'
    process: 'graph.exception.handler'
    output:
      - 'result.status -> output.status'
      - 'result -> output.body'
    description: 'Graph exception handler'
    execution: end
