#
# A SoR milestone acknowledgement.
#
# The fact is recorded FIRST, in the database, where a partial unique index makes it idempotent and
# arrival order irrelevant. Only then does the graph run - and it routes on the DERIVED progress
# (settled / failed / still waiting), not on this particular ack's position in a sequence.
#
# That ordering is the whole point: the three milestones arrive on three independent topics, so
# there is no sequence to be in. Accumulate the set, then ask where the set stands.
#
flow:
  id: 'steward-ack-flow'
  description: 'Record a SoR milestone, then advance the lifecycle if the outcome is now decided'
  ttl: 30s

first.task: 'v1.sor.milestone.record'

tasks:
  - name: 'v1.sor.milestone.record'
    input:
      - 'input.body.fulfillment_id -> fulfillment_id'
      - 'input.body.milestone -> milestone'
      - 'input.body.outcome -> outcome'
      - 'input.body.reason -> reason'
    process: 'v1.sor.milestone.record'
    description: 'Record the milestone as an idempotent fact and derive where the set now stands'
    output:
      - 'result.progress -> model.progress'
      - 'result.to_state -> model.derived_state'
      - 'result.reason -> model.derived_reason'
    execution: sequential
    next:
      - 'graph.executor'

  - name: 'graph.executor'
    input:
      - 'model.instance -> header.instance'
      - 'text(fulfillment-lifecycle) -> header.graph'
      # No body mapping is needed - and none would help. GraphExecutor copies the FLOW's input
      # and model datasets into the graph's state machine, so the graph reads model.progress
      # (set by the task above) directly. A task-level body mapping never reaches the graph.
    process: 'graph.executor'
    description: 'Resume the lifecycle graph; it re-suspends while the milestone set is incomplete'
    output: []
    execution: sequential
    next:
      - 'v1.txn.record.status'

  - name: 'v1.txn.record.status'
    input:
      - 'input.body.fulfillment_id -> fulfillment_id'
      # From the RECORDER, not the graph. The accumulated facts decide the state; the graph
      # decides routing and suspension. While the set is incomplete the recorder answers NOOP,
      # which this function short-circuits on - the graph returns no lifecycle_state at all when
      # it suspends, and reading that produced "Missing to_state" and a retry storm.
      - 'model.derived_state -> to_state'
      - 'text(STEWARD) -> source'
      - 'model.derived_reason -> reason'
    process: 'v1.txn.record.status'
    description: 'Record the state transition, if the accumulated set decided one'
    output:
      - 'result -> output.body'
    execution: end
