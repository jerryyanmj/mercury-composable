flow:
  id: 'steward-tick-flow'
  description: 'Resume the lifecycle graph for a SCHEDULED fulfillment and dispatch it to the SoR'
  ttl: 30s

first.task: 'graph.executor'

tasks:
  - name: 'graph.executor'
    input:
      - 'input.body -> *'
      - 'text(fulfillment-lifecycle) -> header.graph'
      - 'model.instance -> header.instance'
    process: 'graph.executor'
    description: 'Resume lifecycle graph — runs dispatch node, outputs DISPATCHED, suspends at dispatch'
    output:
      - 'result.lifecycle_state -> model.lifecycle_state'
    execution: sequential
    next:
      - 'v1.sor.dispatch'

  - name: 'v1.sor.dispatch'
    input:
      - 'input.body.fulfillment_id -> fulfillment_id'
    process: 'v1.sor.dispatch'
    description: 'Stage sor.dispatch outbox entry (steward relay will publish to Kafka)'
    output: []
    execution: sequential
    next:
      - 'v1.steward.record.status'

  - name: 'v1.steward.record.status'
    input:
      - 'input.body.fulfillment_id -> fulfillment_id'
      - 'text(SCHEDULED) -> from_state'
      - 'model.lifecycle_state -> to_state'
      - 'text(STEWARD) -> source'
    process: 'v1.steward.record.status'
    description: 'Record the SCHEDULED→DISPATCHED transition and stage fulfillment.status'
    output:
      - 'result -> output.body'
    execution: end
