rest:
  - service: 'http.flow.adapter'
    methods: ['POST']
    url: '/api/v1/admin/dispatch'
    flow: 'admin-dispatch-flow'
    timeout: 60s
    tracing: true

  - service: 'http.flow.adapter'
    methods: ['POST']
    url: '/api/v1/admin/relay'
    flow: 'admin-relay-steward-flow'
    timeout: 60s
    tracing: true

  - service: 'http.flow.adapter'
    methods: ['POST', 'GET']
    url: '/api/v1/graph/{graph_id}'
    flow: 'graph-executor'
    timeout: 60s
    tracing: true

cors:
  - id: cors_1
    options:
      - 'Access-Control-Allow-Origin: *'
      - 'Access-Control-Allow-Methods: GET, POST, OPTIONS'
      - 'Access-Control-Allow-Headers: origin, authorization, accept, content-type'
      - 'Access-Control-Max-Age: 86400'
    headers:
      - 'Access-Control-Allow-Origin: *'
