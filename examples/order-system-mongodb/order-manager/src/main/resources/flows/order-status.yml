flow:
  id: 'order-status-flow'
  description: 'Retrieve order status from the CQRS read model'
  ttl: 15s
  exception: 'v1.order.exception'

first.task: 'v1.order.status'

tasks:
  - name: 'v1.order.status'
    input:
      - 'input.path_parameter.order_id -> order_id'
    process: 'v1.order.status'
    description: 'Read the order document and return its status'
    output:
      - 'result -> output.body'
    execution: end

  - name: 'v1.order.exception'
    input:
      - 'error.code -> status'
      - 'error.message -> message'
    process: 'v1.order.exception'
    description: 'Surface read errors'
    output:
      - 'result.status -> output.status'
      - 'result -> output.body'
    execution: end
