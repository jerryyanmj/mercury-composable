flow:
  id: 'admin-relay-flow'
  description: 'Admin: manually trigger the manager outbox relay'
  ttl: 60s
  exception: 'v1.order.exception'

first.task: 'v1.manager.outbox.relay'

tasks:
  - name: 'v1.manager.outbox.relay'
    input:
      - 'text(manual) -> trigger'
    process: 'v1.manager.outbox.relay'
    description: 'Flush unsent outbox entries to Kafka'
    output:
      - 'result -> output.body'
    execution: end

  - name: 'v1.order.exception'
    input:
      - 'error.code -> status'
      - 'error.message -> message'
    process: 'v1.order.exception'
    description: 'Surface relay errors'
    output:
      - 'result.status -> output.status'
      - 'result -> output.body'
    execution: end
